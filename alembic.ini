; trade-intel — Alembic configuration
;
; The actual database URL is loaded from trade_intel.config.get_settings()
; in db/migrations/env.py, so SQLALCHEMY_URL here intentionally stays blank.
; Override via env (SQLITE_URL / POSTGRES_URL / ENVIRONMENT).

[alembic]
script_location = db/migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os

; Filenames like: 20260528_0030_3a1b2c4d_baseline_schema.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

; Resolved at runtime in env.py.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
