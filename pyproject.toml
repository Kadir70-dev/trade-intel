[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-intel"
version = "0.2.0"
description = "AI-powered sourcing intelligence for UAE wholesale electronics trading"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "trade-intel" }]
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "typer>=0.12",
    "openpyxl>=3.1",
    "numpy>=1.26",
    "python-multipart>=0.0.7",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=2.7",
    "faiss-cpu>=1.8",
]
postgres = [
    "psycopg[binary]>=3.1",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "hypothesis>=6",
    "httpx>=0.27",
    "types-openpyxl>=3.1",
]

[project.scripts]
trade-intel = "trade_intel.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
ignore = ["E501"]

# RUF001/002/003 flag visually-ambiguous Unicode (full-width digits,
# NBSP, etc.). The normalization module + its tests use such characters
# on purpose to test that the parser collapses them correctly.
[tool.ruff.lint.per-file-ignores]
"src/trade_intel/normalization/text.py" = ["RUF001", "RUF002", "RUF003"]
"tests/unit/test_normalization_text.py" = ["RUF001", "RUF002", "RUF003"]
"tests/unit/test_whatsapp_date_detect.py" = ["RUF001", "RUF002", "RUF003"]
"tests/unit/test_normalization_identity.py" = ["RUF001", "RUF002", "RUF003"]
"tests/unit/test_normalization_products.py" = ["RUF001", "RUF002", "RUF003"]
"tests/unit/test_intent_classifier.py" = ["RUF001", "RUF002", "RUF003"]
"tests/unit/test_property_based.py" = ["RUF001", "RUF002", "RUF003"]
# Typer's idiomatic API uses `typer.Argument(...)` / `typer.Option(...)` calls in
# function defaults. Ruff's B008 flags this as a code smell, but it's the
# Typer-recommended pattern — opt out for the CLI module only.
"src/trade_intel/cli/main.py" = ["B008"]
# FastAPI's dependency-injection API uses `Depends(...)`, `File(...)`,
# `Form(...)`, `Query(...)`, `Security(...)` etc. in function defaults
# — same Typer-style idiom; opt B008 out for the API entry-point.
"src/trade_intel/api/main.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning"]
