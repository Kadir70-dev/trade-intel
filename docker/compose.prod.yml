# Private VPS stack. ONLY caddy publishes ports (80/443). Postgres, Redis,
# the Go broker, Ollama and the API live on the internal network.
#
#   cp .env.prod.example .env.prod   # fill secrets; never commit it
#   docker compose --env-file .env.prod -f docker/compose.prod.yml up -d --build
#
# Required vars fail fast (${VAR:?}) so a missing secret never boots a default.

x-app-env: &app-env
  ENVIRONMENT: prod
  DEBUG: "false"
  API_RELOAD: "false"
  POSTGRES_URL: postgresql+psycopg://${POSTGRES_USER:-trade}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-trade_intel}
  API_KEY: ${API_KEY:?set API_KEY}
  IMPORT_UPLOADERS: ${IMPORT_UPLOADERS:-Main,Yaseen}
  BROKER_URL: http://broker:8088

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-trade_intel}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trade} -d ${POSTGRES_DB:-trade_intel}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    networks: [internal]

  migrate:
    build: { context: .., dockerfile: docker/api.Dockerfile }
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    networks: [internal]

  api:
    build: { context: .., dockerfile: docker/api.Dockerfile }
    restart: unless-stopped
    environment:
      <<: *app-env
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
    depends_on:
      migrate: { condition: service_completed_successfully }
    expose: ["8000"]
    networks: [internal]

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    expose: ["11434"]
    networks: [internal]

  ollama-pull:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on: [ollama]
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until ollama list >/dev/null 2>&1; do sleep 2; done
        ollama pull ${OLLAMA_MODEL:-llama3.2:3b}
    networks: [internal]

  broker:
    build: { context: .., dockerfile: docker/broker.Dockerfile }
    restart: unless-stopped
    environment:
      <<: *app-env
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      OLLAMA_FALLBACK_MODEL: ${OLLAMA_FALLBACK_MODEL:-llama3.2:3b}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-300}
      CACHE_ENABLED: "true"
      REDIS_ADDR: redis:6379
      BROKER_ADDR: 0.0.0.0:8088
    depends_on:
      migrate: { condition: service_completed_successfully }
      ollama: { condition: service_started }
      redis: { condition: service_started }
    expose: ["8088"]
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api]
    networks: [internal]

networks:
  internal:

volumes:
  postgres-data:
  ollama-data:
  caddy-data:
  caddy-config:
