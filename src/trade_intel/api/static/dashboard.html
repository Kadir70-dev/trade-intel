<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trade Intel</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --mut:#667085; --line:#e4e7ec; --acc:#0b6bcb; --ok:#067647; --bad:#b42318; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12151a; --card:#1b2027; --ink:#e8ecf1; --mut:#9aa4b2; --line:#2c333d; --acc:#5aa9ff; --ok:#4ade80; --bad:#f87171; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui,sans-serif; }
  header { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); background:var(--card); }
  h1 { font-size:16px; margin:0; } h2 { font-size:14px; margin:0 0 10px; }
  main { max-width:1200px; margin:0 auto; padding:16px; display:grid; gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px; }
  .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); }
  .stat b { display:block; font-size:22px; } .stat span { color:var(--mut); font-size:12px; }
  .two { display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); }
  table { width:100%; border-collapse:collapse; } th,td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--mut); font-weight:600; font-size:12px; } .wrap { overflow-x:auto; }
  input,select,button,textarea { font:inherit; padding:7px 10px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--ink); }
  button { background:var(--acc); color:#fff; border:0; cursor:pointer; } button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .grade { font-weight:700; } .msg { color:var(--mut); margin-top:8px; } .err { color:var(--bad); } .good { color:var(--ok); }
  #log { height:260px; overflow:auto; border:1px solid var(--line); border-radius:6px; padding:10px; white-space:pre-wrap; margin-bottom:8px; }
  #login { max-width:380px; margin:12vh auto; }
</style>
</head>
<body>
<section id="login" class="card" hidden>
  <h2>Trade Intel — sign in</h2>
  <form id="login-form" class="row">
    <input id="key" type="password" placeholder="API key" autocomplete="current-password" required style="flex:1">
    <button type="submit">Open</button>
  </form>
  <div id="login-err" class="msg err"></div>
</section>

<div id="app" hidden>
<header><h1>Trade Intel</h1><button id="logout" type="button">Sign out</button></header>
<main>
  <section class="card"><h2>Summary</h2><div id="stats" class="grid"></div></section>

  <div class="two">
    <section class="card"><h2>Match grades</h2><div id="grades" class="grid"></div></section>
    <section class="card"><h2>Buyer / seller intent (messages)</h2><div id="intent" class="grid"></div></section>
  </div>

  <section class="card">
    <h2>Import chat export or sheet</h2>
    <form id="upload-form" class="row">
      <select id="uploader" required></select>
      <input id="file" type="file" accept=".txt,.csv,.xlsx,.xls" multiple required>
      <button id="upload-btn" type="submit">Upload &amp; match</button>
    </form>
    <div id="upload-msg" class="msg"></div>
  </section>

  <section class="card"><h2>Recent imports</h2><div class="wrap"><table id="imports"></table></div></section>
  <section class="card"><h2>Ranked opportunities (buyer ↔ seller)</h2><div class="wrap"><table id="opps"></table></div></section>

  <section class="card">
    <h2>Broker chat (answers come from imported data only)</h2>
    <div id="log"></div>
    <form id="chat-form" class="row">
      <input id="q" placeholder="e.g. need 20 iphone 16 pro max urgent" maxlength="1000" style="flex:1;min-width:200px" required>
      <button id="send" type="submit">Ask</button>
    </form>
  </section>
</main>
</div>
<script src="/static/dashboard.js"></script>
</body>
</html>
